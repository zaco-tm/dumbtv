<?xml version="1.0" encoding="utf-8"?>
<!-- The variant's banner: our own, in the launcher's visual language.
     The mark is the old launcher's, scaled and moved to the left;
     the wordmark is ours. Rendered to res/drawable-nodpi/banner_variant.png with
     rsvg-convert (see variant/README.md). -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#111214"/>
  <g transform="translate(-62,20) scale(0.7)">
    <path fill="none" stroke="#FFFFFF" stroke-width="7"
          d="M118,52h84a7,7 0,0 1,7 7v52a7,7 0,0 1,-7 7h-84a7,7 0,0 1,-7 -7v-52a7,7 0,0 1,7 -7z"/>
    <path fill="#3D8BFF" d="M140,130h40v7h-40z"/>
  </g>
  <text x="88" y="76" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5">dumbtv home</text>
  <text x="90" y="108" fill="#3D8BFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="1.5">variant</text>
</svg>
