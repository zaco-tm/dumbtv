name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  variant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The build-tools version is pinned, so the CI build and the local build use the
      # same aapt2/d8: the newest one in the image changes when GitHub updates it.
      BUILD_TOOLS: "34.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: the vendored tree is upstream's
        run: ./variant/verify-vendor.sh
      - name: the version files agree
        run: ./variant/release-check.sh --manifest
      - name: "build (generic: no TMDB key is ever baked by CI)"
        run: ./variant/build.sh --generic
      - name: the apk is what this repo expects
        run: ./variant/check-apk.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh variant/*.sh; do bash -n "$f" || exit 1; done
      - name: offline script tests (no device)
        run: python3 -m unittest discover -s tests -v
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report --exclude-dir=node_modules \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' \
               --include='*.xml' --include='*.properties' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
               --include='*.java' --include='*.kt' --include='*.gradle' --include='*.kts' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
      - name: no TMDB key in anything committed
        run: |
          # A key with a value: the key's name, an "=" and something that is not a
          # space. The pattern is put together in two parts, so that this file does
          # not match itself. Only the file names are printed: the key itself must
          # not end up in the log either.
          # The generator's own tests and the plan that quotes them carry a deliberate
          # fake ("abc123"), so those two files are excluded; nothing else may match.
          key='tmdb_key'
          if git grep -lE "$key=[^[:space:]]" -- . \
               ':!tests/test_variant_config.py' \
               ':!docs/superpowers/plans/2026-10-26-variant-launcher-stage1.md'; then
            echo "remove the TMDB key: it belongs in variant/config.properties, not the repo"; exit 1
          fi

  # The design tree. It is a Vite app, and the build is the check.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - run: npm run build
        working-directory: prototype

  # The app. Its tokens come from the prototype's CSS, so the generator runs first and
  # the result is checked: a hand-edited tokens.ts is a broken token.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          # The NDK and CMake are named here because the new architecture compiles the
          # app's own C++ (the codegen and the TurboModule glue), and AGP will not
          # download them on a runner without the licences accepted first.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null
      - run: npm ci
        working-directory: app
      - name: the tokens are the prototype's
        working-directory: app
        run: |
          node tools/gen-tokens.mjs
          if ! git diff --quiet -- src/ui/charcoal/tokens.ts; then
            echo "tokens.ts is not what the generator makes: run 'npm run tokens' in app/"; exit 1
          fi
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - name: the apk builds
        # One ABI: the television is arm64, and four of them do not fit the runner's
        # disk with the NDK in them. The build is a check, not a release.
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: app/android
